<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#9ED8F5">
  <title>Truco para chicos</title>
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Inicio. El toque en Aprender también habilita el audio del navegador.
       El botón Jugar (partida directa a 15) se suma cuando esté hecho el nivel 5. -->
  <section id="p-inicio" class="pantalla activa">
    <div class="sol-deco"></div>
    <div class="nube" style="left: 7vw; top: 9vh;"></div>
    <div class="nube" style="left: 40vw; top: 26vh; transform: scale(0.75);"></div>
    <div class="loma"></div>
    <div class="capi inicio-capi"><img src="img/capi.svg" alt="" draggable="false"></div>
    <div class="globo inicio-globo">¡Vamos a aprender!</div>
    <div class="inicio-centro">
      <div class="titulo">
        <h1>Truco</h1>
        <p>para chicos</p>
      </div>
      <div class="con-etiqueta">
        <button id="btn-aprender" class="btn grande sol" aria-label="Aprender a jugar con Capi"></button>
        <span class="etiqueta">Aprender</span>
      </div>
    </div>
  </section>

  <!-- Elegir nivel: un camino -->
  <section id="p-niveles" class="pantalla">
    <div class="nube" style="left: 72vw; top: 20vh;"></div>
    <div class="nube" style="left: 8vw; top: 22vh; transform: scale(0.7);"></div>
    <div class="loma"></div>
    <div class="barra">
      <button id="btn-inicio" class="btn" aria-label="Volver al inicio"></button>
      <div class="barra-centro"><h2>Aprender</h2></div>
      <div class="barra-derecha">
        <div id="cuenta-estrellas" class="cuenta-estrellas"></div>
        <button class="btn btn-ayuda" aria-label="Escuchar de nuevo"></button>
      </div>
    </div>
    <div id="camino" class="camino"></div>
    <button class="capi niveles-capi" aria-label="Capi: escuchar de nuevo"><img src="img/capi.svg" alt="" draggable="false"></button>
  </section>

  <!-- Juego -->
  <section id="p-juego" class="pantalla">
    <div class="barra">
      <button id="btn-casa" class="btn" aria-label="Volver a los niveles"></button>
      <div class="barra-centro"><div id="marcador"></div></div>
      <button class="btn btn-ayuda" aria-label="Escuchar de nuevo"></button>
    </div>
    <div class="mesa">
      <div class="zona">
        <div class="lado-capi">
          <button class="capi" aria-label="Capi: ayuda"><img src="img/capi.svg" alt="" draggable="false"></button>
          <div id="dorsos" class="dorsos"></div>
          <div id="globo-toca" class="globo sol">¡Te toca!</div>
        </div>
        <div id="tablero" class="tablero"></div>
        <div id="cantos" class="cantos"></div>
      </div>
      <div id="mano" class="mano"></div>
    </div>
  </section>

  <!-- Fin de nivel -->
  <section id="p-fin" class="pantalla">
    <div class="rayos"></div>
    <div class="loma"></div>
    <div id="estrellas" class="estrellas"></div>
    <div class="titulo"><h1 id="fin-titulo"></h1></div>
    <div class="fin-abajo">
      <div class="fin-capi-lado">
        <div id="fin-globo" class="globo"></div>
        <button class="capi fin-capi" aria-label="Capi: escuchar de nuevo"><img src="img/capi.svg" alt="" draggable="false"></button>
      </div>
      <div class="fin-botones">
        <div class="con-etiqueta">
          <button id="btn-otra" class="btn grande sol" aria-label="Jugar otra vez"></button>
          <span class="etiqueta">Otra vez</span>
        </div>
        <div class="con-etiqueta">
          <button id="btn-fin-niveles" class="btn mediano" aria-label="Ir a los niveles"></button>
          <span class="etiqueta">Niveles</span>
        </div>
      </div>
    </div>
  </section>

  <script src="js/frases.js"></script>
  <script src="js/voz.js"></script>
  <script src="js/mazo.js"></script>
  <script src="js/motor.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/cartas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
