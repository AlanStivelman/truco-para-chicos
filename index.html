<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#9ED8F5">
  <title>Truco para chicos</title>
  <link rel="preload" href="img/baraja-espanola.webp" as="image">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Inicio: dos caminos. El primer toque en cualquier lado habilita el audio del navegador. -->
  <section id="p-inicio" class="pantalla activa">
    <div class="barra">
      <a class="creditos" href="creditos.html">Créditos</a>
      <button class="btn-redondo sol oir" aria-label="Escuchar de nuevo" data-icono="parlante"></button>
    </div>
    <div class="inicio-cuerpo">
      <div class="inicio-capi">
        <p class="globo">¿Jugamos o aprendemos?</p>
        <div class="capi grande" data-capi></div>
      </div>
      <div class="inicio-derecha">
        <h1 class="titulo"><span>Truco</span><span class="para-chicos">para chicos</span></h1>
        <div class="inicio-botones">
          <div class="con-etiqueta">
            <button id="btn-aprender" class="btn-redondo enorme" aria-label="Aprender a jugar con Capi" data-icono="libro"></button>
            <span class="etiqueta">Aprender</span>
          </div>
          <div class="con-etiqueta">
            <button id="btn-jugar" class="btn-redondo enorme sol" aria-label="Jugar un partido" data-icono="play"></button>
            <span class="etiqueta">Jugar</span>
          </div>
        </div>
      </div>
    </div>
    <div class="loma" aria-hidden="true"></div>
  </section>

  <!-- Elegir nivel: un camino de paradas -->
  <section id="p-niveles" class="pantalla">
    <div class="barra">
      <button id="btn-niveles-casa" class="btn-redondo" aria-label="Volver al inicio" data-icono="casa"></button>
      <div id="estrellas-total" class="pastilla" aria-live="polite"></div>
      <button class="btn-redondo sol oir" aria-label="Escuchar de nuevo" data-icono="parlante"></button>
    </div>
    <div class="camino-caja">
      <svg id="camino" class="camino" aria-hidden="true"></svg>
      <div id="niveles" class="niveles"></div>
    </div>
    <div class="loma" aria-hidden="true"></div>
  </section>

  <!-- Juego -->
  <section id="p-juego" class="pantalla">
    <div class="barra">
      <button id="btn-casa" class="btn-redondo" aria-label="Volver" data-icono="mapa"></button>
      <div id="marcadores" class="marcadores"></div>
      <button class="btn-redondo sol oir" aria-label="Escuchar de nuevo" data-icono="parlante"></button>
    </div>
    <div id="mesa" class="mesa"></div>
    <div id="mano" class="mano"></div>
  </section>

  <!-- Fin de nivel -->
  <section id="p-fin" class="pantalla">
    <div class="barra">
      <span></span>
      <button class="btn-redondo sol oir" aria-label="Escuchar de nuevo" data-icono="parlante"></button>
    </div>
    <div id="estrellas" class="estrellas"></div>
    <div class="fin-cuerpo">
      <div class="capi mediano" data-capi></div>
      <div class="fin-botones">
        <div class="con-etiqueta">
          <button id="btn-otra" class="btn-redondo grande sol" aria-label="Jugar otra vez" data-icono="repetir"></button>
          <span class="etiqueta">Otra vez</span>
        </div>
        <div class="con-etiqueta">
          <button id="btn-fin-casa" class="btn-redondo grande" aria-label="Volver a los niveles" data-icono="mapa"></button>
          <span class="etiqueta" id="etiqueta-fin-casa">Niveles</span>
        </div>
      </div>
    </div>
    <div class="loma" aria-hidden="true"></div>
  </section>

  <script src="js/frases.js"></script>
  <script src="js/voz.js"></script>
  <script src="js/mazo.js"></script>
  <script src="js/motor.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/cartas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
